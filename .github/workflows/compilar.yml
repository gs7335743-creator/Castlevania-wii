name: Compilar Castlevania Wii

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    steps:
      - name: Baixar codigo do jogo
        uses: actions/checkout@v4

      - name: Baixar GRRLIB oficial
        uses: actions/checkout@v4
        with:
          repository: GRRLIB/GRRLIB
          path: grrlib_src

      - name: Instalar GRRLIB
        run: |
          make -C grrlib_src/GRRLIB
          make -C grrlib_src/GRRLIB install

      - name: Compilar boot.dol
        run: make

      - name: Salvar boot.dol
        uses: actions/upload-artifact@v4
        with:
          name: castlevania-wii-dol
          path: "*.dol"
          
