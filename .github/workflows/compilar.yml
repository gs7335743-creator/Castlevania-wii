name: Compilar Castlevania Wii

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar bibliotecas Wii e GRRLIB
        run: |
          dkp-pacman -Syu --noconfirm git ppc-libpng ppc-libjpeg-turbo ppc-freetype ppc-libmad libfat-ogc
          git clone https://github.com /tmp/GRRLIB
          make -C /tmp/GRRLIB/GRRLIB install

      - name: Compilar boot.dol
        run: make

      - name: Salvar boot.dol
        uses: actions/upload-artifact@v4
        with:
          name: castlevania-wii-dol
          path: "*.dol"
          
