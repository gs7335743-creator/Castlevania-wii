name: Compilar Castlevania Wii

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar GRRLIB
        run: |
          apt-get update && apt-get install -y curl unzip
          curl -L https://github.com -o /tmp/grrlib.zip
          unzip -q /tmp/grrlib.zip -d /tmp
          make -C /tmp/GRRLIB-master/GRRLIB install

      - name: Compilar boot.dol
        run: make

      - name: Salvar boot.dol
        uses: actions/upload-artifact@v4
        with:
          name: castlevania-wii-dol
          path: "*.dol"
          
